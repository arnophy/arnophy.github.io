  function selectedCity(){return state.plan==="ultra"&&[state.profile.city,...state.passportCities].includes(ui.city)?ui.city:state.profile.city}
  function matchReasons(person){
    const reasons=[];
    if(person.roots.some(code=>state.profile.roots.includes(code)))reasons.push(t("reasonRoots"));
    if((state.profile.interests||[]).includes(person.interest))reasons.push(t("reasonInterest",{interest:interestName(person.interest)}));
    const shared=(state.profile.langs||[]).find(code=>person.langs.includes(code));
    if(shared)reasons.push(t("reasonLanguage",{language:languageName(shared)}));
    if(person.city===state.profile.city)reasons.push(t("reasonCity",{city:person.city}));
    return reasons;
  }
  function matchScore(person){return (person.roots.some(code=>state.profile.roots.includes(code))?3:0)+((state.profile.interests||[]).includes(person.interest)?3:0)+(person.langs.some(code=>(state.profile.langs||[]).includes(code))?2:0)}
  function suggestedOpener(person){return t("suggestedOpener",{name:person.name.split(" ")[0],interest:interestName(person.interest)})}
  function openPersonChat(person){
    const threadId=`person:${person.id}`;
    if(!state.chats.some(thread=>thread.id===threadId))state.chats.unshift({id:threadId,kind:"person",ref:person.id,messages:[]});
    ui.thread=threadId;
    ui.draft=suggestedOpener(person);
    save();go("chats");
    document.getElementById("message-text")?.focus();
  }
  function findPeople(){if(ui.savedOnly)return state.savedPeople.map(personById).filter(person=>person&&!state.blocked.includes(person.id));const city=selectedCity();return PEOPLE.filter(person=>{
    if(person.city!==city||state.blocked.includes(person.id)||state.seen.ids.includes(person.id))return false;
    if(ui.mode==="roots"&&!person.roots.some(code=>state.profile.roots.includes(code)))return false;
    if(ui.mode==="world"&&ui.targetCountry!=="any"&&!person.roots.includes(ui.targetCountry))return false;
    if(ui.activity!=="any"&&person.interest!==ui.activity)return false;
    if(state.plan==="ultra"&&ui.school!=="any"&&person.school!==ui.school)return false;
    if(state.plan==="ultra"&&ui.language!=="any"&&!person.langs.includes(ui.language))return false;
    if(state.plan==="ultra"&&ui.arrival!=="any"&&person.arrival!==ui.arrival)return false;
    return true;
  }).sort((a,b)=>matchScore(b)-matchScore(a)).slice(0,6)}

Note"))} ${esc(t("passportNote"))}</span><button type="button" data-action="nav" data-page="plans">${esc(t("upgradeUltra"))}</button></div>`}
      </section>

      ${ui.savedOnly?`<p class="muted small">${esc(t("savedNote"))}</p>`:`<div class="quota"><span>${esc(t("viewed",{used,limit}))}</span><div class="meter"><div class="meter-fill" style="width:${Math.min(100,used/limit*100)}%"></div></div><span>${esc(t("oneAtATime"))}</span></div>`}

  root.addEventListener("click",event=>{
    if(event.target.classList.contains("dialog-backdrop")){ui.dialog=null;render();return}
    const button=event.target.closest("[data-action]");if(!button)return;
    const {action,id,page,mode,plan,city}=button.dataset;
    if(action==="nav"){go(page);return}
    if(action==="mode"){ui.mode=mode;render();return}
    if(action==="show-discover"||action==="show-saved"){ui.savedOnly=action==="show-saved";render();return}
    if(action==="save-person"){
      const person=personById(id);if(!person)return;
      const saved=state.savedPeople.includes(id);
      if(saved)state.savedPeople=state.savedPeople.filter(item=>item!==id);
      else{
        if(!state.seen.ids.includes(id)&&state.seen.ids.length>=discoveryLimit()){notify(t("dailyLimit"));return}
        state.savedPeople.unshift(id);
        if(!state.seen.ids.includes(id))state.seen.ids.push(id);
      }
      save();render();notify(t(saved?"removedSaved":"personSaved"));return;
    }
    if(action==="apply"){document.getElementById("people-results")?.scrollIntoView({behavior:"smooth",block:"start"});return}
    if(action==="view-person"){
      if(!state.seen.ids.includes(id)){
        if(state.seen.ids.length>=discoveryLimit()){notify(t("dailyLimit"));return}
        state.seen.ids.push(id);save();
      }
      ui.dialog={type:"person",id};render();return;
    }
    if(action==="close-dialog"){ui.dialog=null;render();return}
    if(action==="report-open"){ui.dialog={type:"report",id};render();return}

    if(action==="pass"||action==="hello"||action==="priority"){
      if(action==="priority"&&state.plan==="free"){go("plans");return}
      if(!state.seen.ids.includes(id)&&state.seen.ids.length>=discoveryLimit()){notify(t("dailyLimit"));return}

    }

      ui.thread=threadId;ui.draft="";save();go("chats");return;
    }
    if(action==="toggle-meetup"){
      const joined=state.rsvps.includes(id);

    if(action==="cancel-edit"){ui.editing=false;render();return}

    if(step===0)return field("name","name","text",true)+field("city","livingIn","text",true)+field("school","school")+field("major","major")+choiceField("studyStage","studyStage")+field("arrival","monthArrived","month");
    if(step===1)return rootsPicker()+field("homeTown","homeTown")+chipsField("langs","languages",LANGUAGE_CODES,languageName);
    return chipsField("interests","interests",INTERESTS,interestName)+choiceField("lookingFor","lookingFor")+choiceField("socialPace","socialPace")+field("icebreaker","icebreaker")+field("weekend","weekend")+`<label class="field wide"><span class="field-label">${esc(t("aboutMe"))} · ${esc(t("optional"))}</span><textarea class="control" name="intro" maxlength="400">${esc(profileDraft.intro||"")}</textarea></label>`;
  }
  function renderOnboarding(){return `<div class="onboarding page"><div class="eyebrow">BRIDGE / ${welcomeStep+1} OF 3</div><h1>${esc(t("welcome"))}</h1><p class="lead">${esc(t("welcomeNote"))}</p><div class="step-track" aria-label="${welcomeStep+1} / 3">${["basics","story","connection"].map((key,i)=>`<div class="${i===welcomeStep?'current':i<welcomeStep?'complete':''}" ${i===welcomeStep?'aria-current="step"':''}><b>${i+1}</b><span>${esc(t(key))}</span></div>`).join("")}</div><form id="welcome-form" class="panel"><h2 tabindex="-1" id="question-heading">${esc(t(["basics","story","connection"][welcomeStep]))}</h2><div class="edit-grid">${questionSection(welcomeStep)}</div><div class="dialog-actions">${welcomeStep?`<button type="button" class="btn" data-action="welcome-back">${esc(t("back"))}</button>`:''}<button class="btn primary" type="submit">${esc(t(welcomeStep===2?"finish":"next"))} →</button></div><p class="muted small">${esc(t("savedLocally"))}</p></form></div>`}
  function renderProfile(){
    if(ui.editing)return `<div class="page"><div class="page-heading"><h1>${esc(t("editProfile"))}</h1></div><form id="enhanced-profile-form" class="panel">${["basics","story","connection"].map((key,i)=>`<section class="profile-section"><h2>${esc(t(key))}</h2><div class="edit-grid">${questionSection(i)}</div></section>`).join("")}<div class="dialog-actions"><button class="btn primary" type="submit">${esc(t("save"))}</button><button class="btn" type="button" data-action="cancel-edit">${esc(t("cancel"))}</button></div></form></div>`;
    const p=state.profile;
    const additions=`<article class="panel personal-notes"><div><div class="eyebrow">${esc(t("personalNotes"))}</div><h3>${esc(p.icebreaker||t("connection"))}</h3></div><div class="details">${["major","studyStage","lookingFor","socialPace","weekend"].filter(key=>p[key]).map(key=>`<div><span class="detail-label">${esc(t(key))}</span><span class="detail-value">${esc(EXTRA_OPTIONS[key]?t(p[key]):p[key])}</span></div>`).join("")}</div><button type="button" class="btn tiny" data-action="replay-welcome">${esc(t("replay"))}</button></article>`;
    return legacyProfile().replace('<div class="profile-grid">',additions+'<div class="profile-grid">');
  }
  function captureProfileInput(el){
    if(!el.name)return;
    if(["roots","langs","interests"].includes(el.name)){const values=new Set(profileDraft[el.name]||[]);if(el.checked)values.add(el.value);else values.delete(el.value);profileDraft[el.name]=[...values];}
    else profileDraft[el.name]=el.value;
    if(!state.onboarded){state.onboardingDraft=profileDraft;save();}
  }
  function updateRoots(){const tags=document.getElementById("selected-roots"),results=document.getElementById("root-results");if(tags)tags.innerHTML=rootTags();if(results)results.innerHTML=rootResults(document.getElementById("roots-search")?.value||"");}
  root.addEventListener("input",event=>{const el=event.target;if(el.id==="roots-search"){updateRoots();return}if(el.closest?.('#welcome-form, #enhanced-profile-form'))captureProfileInput(el);});
  root.addEventListener("change",event=>{const el=event.target;if(el.closest?.('#welcome-form, #enhanced-profile-form')){captureProfileInput(el);if(el.name==="roots")updateRoots();}});
  root.addEventListener("click",event=>{
    const button=event.target.closest('[data-action]');if(!button)return;
    const action=button.dataset.action;
    if(action==="edit-profile"){profileDraft={...state.profile};render();}
    if(action==="remove-root"){profileDraft.roots=(profileDraft.roots||[]).filter(code=>code!==button.dataset.code);if(!state.onboarded){state.onboardingDraft=profileDraft;save();}updateRoots();}
    if(action==="welcome-back"){welcomeStep=Math.max(0,welcomeStep-1);render();document.getElementById("question-heading")?.focus();}
    if(action==="replay-welcome"){profileDraft={...state.profile};state.onboarded=false;welcomeStep=0;save();render();}
  });
  root.addEventListener("submit",event=>{
    if(!["welcome-form","enhanced-profile-form"].includes(event.target.id))return;
    event.preventDefault();
    if((welcomeStep===0||event.target.id==="enhanced-profile-form")&&(!profileDraft.name?.trim()||!profileDraft.city?.trim())){notify(t("required"));return;}
    if(event.target.id==="welcome-form"&&welcomeStep<2){welcomeStep++;render();document.getElementById("question-heading")?.focus();return;}
    state.profile={...state.profile,...profileDraft,name:profileDraft.name.trim(),city:profileDraft.city.trim()};state.onboarded=true;delete state.onboardingDraft;
    state.passportCities=state.passportCities.filter(city=>city!==state.profile.city);ui.city=state.profile.city;ui.editing=false;
    if(!state.profile.roots.length){ui.mode="world";ui.targetCountry="any";}
    ui.page=event.target.id==="welcome-form"?"discover":"profile";save();render();notify(t("saved"));
  });
  render();
})();
});
</script>
</head>
<body>
  <div id="app"></div>
  <noscript>Bridge needs JavaScript to show this preview.</noscript>
</body>
</html>
